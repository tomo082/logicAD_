name: Figure 2 offline tests
on:
  push:
    paths: ['logicad_fig2/**', 'scripts/*logicad_fig2.py', 'tests/fig2/**', 'requirements_logicad_fig2.txt', '.github/workflows/fig2-tests.yml']
  pull_request:
    paths: ['logicad_fig2/**', 'scripts/*logicad_fig2.py', 'tests/fig2/**', 'requirements_logicad_fig2.txt', '.github/workflows/fig2-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements_logicad_fig2.txt
      - run: python -m pytest tests/fig2 -q
